schema: spec-driven

context: |
  Portfolio demo for a Staff SWE application: fine-tuned small model +
  Strands Agents SDK agent + rigorous evals (evals are the primary deliverable).
  HARD CONSTRAINT: all medical data is synthetic and the disease is fictional,
  defined by a hidden seeded scoring rule we own. State this in README, UI and
  data files. The agent must never give real medical advice.
  Stack: Python data_gen/ training/ agent/ evals/; Next.js web/ (Vercel) proxying
  /api/analyze with a shared-secret header to FastAPI+Strands on Render;
  classifier served on CPU in the container; LoRA model is offline comparison only;
  orchestrator is Claude via Anthropic API. Evals use Inspect AI (+ promptfoo in CI),
  MLflow for training runs. Evals target the deployed API.
  Prefer code-graded scorers over model-graded. Everything seeded and reproducible.
  LLM spend must be protected: rate limit, input caps, spend limit.
  Assumed unless changed: classifier-only live serving, single-page UI, Anthropic
  API (not Bedrock) for the orchestrator.

rules:
  proposal:
    - State out-of-scope items and which eval categories the change affects
  specs:
    - Scenarios need measurable thresholds, not vague quality claims
    - Cover safety and adversarial behavior explicitly where relevant
  design:
    - Note reproducibility (seeds, pinned versions) and cost/secrets impact
  tasks:
    - Every behavior-changing task has a paired test or eval task

operations:
  apply:
    guidance:
      - Run the fast eval subset before marking a task done
