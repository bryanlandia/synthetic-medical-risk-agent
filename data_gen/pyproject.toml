[project]
name = "data-gen"
version = "0.1.0"
description = "Seeded generator for a FICTIONAL disease: synthetic patients, labels and clinical notes. No real data."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1,<3",
    "pydantic>=2.9,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[project.scripts]
data-gen = "data_gen.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_gen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
