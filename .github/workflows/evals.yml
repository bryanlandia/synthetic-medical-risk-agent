name: Evals regression subset

# The key-free fast subset of the eval harness: harness tests plus the regression subset on the reference systems
# (oracle, floor, lab-only). It makes no API call, uses no secret and spends nothing.

on:
  pull_request:
    paths:
      - "evals/**"
      - "data_gen/**"
      - ".github/workflows/evals.yml"

permissions: {}

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"

      - name: Install
        working-directory: evals
        run: uv sync --frozen

      - name: Harness tests
        working-directory: evals
        env:
          ANTHROPIC_API_KEY: ""
        run: uv run pytest -q

      - name: Regression subset
        working-directory: evals
        env:
          ANTHROPIC_API_KEY: ""
        run: uv run evals regression
