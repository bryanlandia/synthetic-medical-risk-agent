[project]
name = "risk-model"
version = "0.1.0"
description = "Inference for the FICTIONAL-disease note reader and risk classifier: numpy and the standard library only. All data is synthetic."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/risk_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
