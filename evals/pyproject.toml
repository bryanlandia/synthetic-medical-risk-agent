[project]
name = "evals"
version = "0.1.0"
description = "Eval harness for the FICTIONAL-disease risk reports: contract, graders, reference systems. All data is synthetic."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "data-gen",
    "httpx>=0.27,<1",
    "inspect-ai==0.3.285",
    "numpy>=2.1,<3",
    "pydantic>=2.9,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[project.scripts]
evals = "evals.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evals"]

[tool.uv.sources]
data-gen = { path = "../data_gen", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
