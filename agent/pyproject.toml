[project]
name = "agent"
version = "0.1.0"
description = "Chat service for the FICTIONAL-disease risk classifier: a Strands agent with one scoring tool, behind guards. All data is synthetic."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "risk-model",
    "strands-agents[anthropic]==1.62.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[project.scripts]
agent = "agent.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.uv.sources]
risk-model = { path = "../risk_model", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
